[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "moosegoose-model-intelligence"
version = "0.1.0"
description = "Durable collectors and analytical contracts for AI model intelligence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "httpx[http2]>=0.28,<1",
  "pyarrow>=20,<30",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "rich>=14,<15",
  "tenacity>=9,<10",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
scrape = [
  "crawlee[playwright]>=1.8,<2",
]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
model-intel = "model_intelligence.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/model_intelligence"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["model_intelligence"]
